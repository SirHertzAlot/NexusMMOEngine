name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: no-console guard (SAB logging layer)
        run: npm run lint

      - name: Codegen
        run: npm run codegen

      - name: Codegen reproducibility check
        # generated/ is gitignored; drift = "not reproducible from the .fbs"
        run: |
          OUT_DIR=/tmp/gen-check npm run codegen
          diff -r packages/schema/generated /tmp/gen-check \
            && echo "codegen reproducible"

      - name: Test
        run: npm test
        env:
          # Diagnostic: record each Node process that exits non-zero (see scripts/exit-trace.cjs).
          NODE_OPTIONS: "--require ${{ github.workspace }}/scripts/exit-trace.cjs --trace-exit"
          EXIT_TRACE_LOG: "${{ runner.temp }}/exit-trace.log"

      - name: Exit diagnostic
        if: failure()
        run: |
          node -v
          echo "--- non-zero exits recorded by scripts/exit-trace.cjs ---"
          cat "$EXIT_TRACE_LOG" || echo "No Node process exited non-zero."
          echo "--- codec addon ---"
          ls -la packages/addons/codec/build/Release || true
          node -e "require('./packages/addons/codec/index.js'); console.log('codec addon loads')" 2>&1 | head -n 12 || true
          echo "--- uWebSockets.js ---"
          (cd packages/engine-core && node -e "require('uWebSockets.js'); console.log('uWebSockets.js loads')" 2>&1 | head -n 5) || true
          echo "--- failing test files, run alone ---"
          grep -o ' /[^ ]*\.test\.js' "$EXIT_TRACE_LOG" 2>/dev/null | tr -d ' ' | sort -u | while read -r file; do
            echo "== $file"
            node "$file" 2>&1 | tail -n 150
            echo "exit=${PIPESTATUS[0]}"
          done
        env:
          EXIT_TRACE_LOG: "${{ runner.temp }}/exit-trace.log"
