name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # A hang fails the job here instead of holding the runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # npm ci does not run the addons' install scripts, so without this the
      # native bindings (codec, terrain-kernel, ...) are missing and the tests
      # that load them fail.
      - name: Native addons
        run: npm run install --workspaces --if-present

      - name: no-console guard (SAB logging layer)
        run: npm run lint

      - name: Codegen
        run: npm run codegen

      - name: Codegen reproducibility check
        # generated/ is gitignored; drift = "not reproducible from the .fbs"
        run: |
          OUT_DIR=/tmp/gen-check npm run codegen
          diff -r packages/schema/generated /tmp/gen-check \
            && echo "codegen reproducible"

      - name: Test
        # Keep the log so a failure can print the failing tests below.
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Failing tests
        if: failure()
        run: |
          # The spec reporter prints each failing test's error after its file.
          awk '/failing tests:/{n=80} n&&n--' "$RUNNER_TEMP/test.log" | head -n 400

  # Temporary, to find out why the protocol parity test dies on the runner.
  # Remove this job with the fix.
  parity-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build codec and protocol
        run: |
          npm run install --workspace=@mmo-engine/addon-codec
          npm run build --workspace=@mmo-engine/protocol

      - name: Parity test, and where it dies
        run: |
          node -p "process.version + ' ' + process.arch"
          grep -o -w -E 'avx2|fma|bmi2|avx512f' /proc/cpuinfo | sort | uniq -c
          cat /proc/sys/kernel/randomize_va_space
          cd packages/protocol
          node dist/test/fast-path-parity.test.js 2>&1 | tail -n 60
          echo "exit=${PIPESTATUS[0]}"
          sudo apt-get install -y gdb > /dev/null 2>&1 || echo "gdb install failed"
          gdb -batch -ex 'set disable-randomization off' -ex run -ex bt -ex 'x/6i $pc' \
            --args node dist/test/fast-path-parity.test.js 2>&1 | tail -n 80
